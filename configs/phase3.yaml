phase3:
  elbow:
    # Human-facing channel numbers are 1-based: CH2 == SleeveFrame.channels[1].
    sleeve_channel: 1

    # Must be filled from tools/calibrate_sleeve_elbow.py before real Sleeve use.
    input_min: 1
    input_max: 551
    invert_input: false
    deadzone: 0.02

    filter:
      type: ema
      alpha: 0.2

    robot_range:
      mode: relative
      # Initial validation window around the startup elbow position, not joint limits.
      min_delta_deg: -3.0
      max_delta_deg: 180

    invert_output: false

  sensor_timeout_ms: 200
  hard_timeout_ms: 1000
  control_hz: 100
