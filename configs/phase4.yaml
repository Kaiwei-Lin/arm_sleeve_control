predictor:
  # Default shoulder predictor; tools/run_model_control.py can override this
  # with --shoulder-predictor.
  backend: dual_imu

  # Retained three-flex-sensor shoulder predictor (CH3/CH4/CH5).
  flexarm_estimator:
    model_dir: ../../arm_data_collector/flexarm_estimator/models
    sleeve_channels: [3, 4, 5]
    calibration_file: ../calibrations/flexarm_live_calibration.json
    calibration_seconds: 3.0
    angle:
      min_deg: 0
      max_deg: 180

phase4_validation:
  # Direction/magnitude are converted to absolute shoulder semantic angles.
  max_consecutive_prediction_errors: 3
