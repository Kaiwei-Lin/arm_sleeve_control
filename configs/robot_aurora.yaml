    index: 0
    sign: -1
    zero: 0.0
    verified: true
    limits:
      min_position: -2.9671
      max_position: 2.9671
      max_velocity: 7.75
      max_feedback_velocity: 7.75
      max_position_step: 0.0775
      max_tracking_error: 3.14
  - name: shoulder_abduction
