# GR3 official joint bounds and maximum velocities (rad, rad/s).
# Source: https://support-old.fftai.com/docs/GR-X-Humanoid-Robot/GR3/SDK/Aurora-SDK/reference/robot_specs/
# max_position_step = max_velocity / control_hz (100 Hz).
# Physical order: shoulder_pitch, shoulder_roll, shoulder_yaw, elbow_pitch,
#                 wrist_yaw, wrist_pitch, wrist_roll.
# Semantic signs, zeroes and verification flags retain the site calibration.
# Tracking-error and timeout settings are application limits, not vendor specs.
api_family: aurora-python-dds-0.1.8
sdk_version: 0.1.8
verified: true
simulated: false
verification_note: '测试'
robot_type: GR3
authority_verified: true
connection:
  domain_id: 123
  robot_name: gr3
  is_ros_compatible: false
# First entry selects the model-control FSM: 11 = UpperBodyUserCmd, 2 = PdStand.
allowed_fsm:
- 11
control_hz: 100.0
# Position/speed/step/tracking limits shape commands instead of aborting control.
smooth_limits: true
feedback_timeout_s: 0.25
endpoint_timeout_s: 5.0
arrival_timeout_s: 3.0
arrival_tolerance_rad: 0.02
stop_policy: stop_publishing
groups:
- name: left_manipulator
  side: left
  part: arm
  count: 7
  verified: true
  capabilities:
  - joint_position
  sdk_position_limits:
  - - -2.9671
    - 2.9671
  - - -0.2618
    - 1.9199
  - - -1.8326
    - 1.8326
  - - -2.2689
    - 0.087266
  - - -1.8326
    - 1.8326
  - - -0.87266
    - 1.309
  - - -1.0472
    - 1.2217
  max_tracking_error: 3.14
  joints:
  - name: shoulder_flexion
    index: 0
    sign: -1
    zero: 0.0
    verified: true
    limits:
      min_position: -2.9671
      max_position: 2.9671
      max_velocity: 7.75
      max_feedback_velocity: 7.75
      max_position_step: 0.0775
      max_tracking_error: 3.14
  - name: shoulder_abduction
    index: 1
    sign: 1
    zero: 0.0
    verified: true
    limits:
      min_position: -0.2618
      max_position: 1.9199
      max_velocity: 7.75
      max_feedback_velocity: 7.75
      max_position_step: 0.0775
      max_tracking_error: 3.14
  - name: upper_arm_rotation
    index: 2
    sign: 1
    zero: 0.0
    verified: true
    limits:
      min_position: -1.8326
      max_position: 1.8326
      max_velocity: 6.28
      max_feedback_velocity: 6.28
      max_position_step: 0.0628
      max_tracking_error: 3.14
  - name: elbow_flexion
    index: 3
    sign: -1
    zero: 0.0
    verified: true
    limits:
      min_position: -0.087266
      max_position: 2.2689
      max_velocity: 6.28
      max_feedback_velocity: 6.28
      max_position_step: 0.0628
      max_tracking_error: 3.14
- name: right_manipulator
  side: right
  part: arm
  count: 7
  verified: true
  capabilities:
  - joint_position
  sdk_position_limits:
  - - -2.9671
    - 2.9671
  - - -1.9199
    - 0.2618
  - - -1.8326
    - 1.8326
  - - -2.2689
    - 0.087266
  - - -1.8326
    - 1.8326
  - - -0.87266
    - 1.309
  - - -1.2217
    - 1.0472
  max_tracking_error: 3.14
  joints:
  - name: shoulder_flexion
    index: 0
    sign: -1
    zero: 0.15
    verified: true
    limits:
      min_position: -2.9671
      max_position: 2.9671
      max_velocity: 7.75
      max_feedback_velocity: 7.75
      max_position_step: 0.0775
      max_tracking_error: 3.14
  - name: shoulder_abduction
    index: 1
    sign: -1
    zero: 0.0
    verified: true
    limits:
      min_position: -0.2618
      max_position: 1.9199
      max_velocity: 7.75
      max_feedback_velocity: 7.75
      max_position_step: 0.0775
      max_tracking_error: 3.14
  - name: upper_arm_rotation
    index: 2
    sign: 1
    zero: 0.0
    verified: true
    limits:
      min_position: -1.8326
      max_position: 1.8326
      max_velocity: 6.28
      max_feedback_velocity: 6.28
      max_position_step: 0.0628
      max_tracking_error: 3.14
  - name: elbow_flexion
    index: 3
    sign: -1
    zero: 0.0
    verified: true
    limits:
      min_position: -0.087266
      max_position: 2.2689
      max_velocity: 6.28
      max_feedback_velocity: 6.28
      max_position_step: 0.0628
      max_tracking_error: 3.14
# Application pose order is semantic: thumb bend, index, middle, ring, pinky, thumb swing.
# SDK slot order is defined by each group's joint indices below.
# Left hand retains its previous layout; this session only checked the right hand.
# These are direct SDK radians; speed/step/tracking limits are application limits.
# Keep target slew separate from the measured-speed alarm threshold.
# The 3.14 rad/s feedback threshold is a site setting, not a vendor speed rating.
- &aurora_hand
  name: left_hand
  side: left
  part: hand
  count: 6
  verified: true
  capabilities: [joint_position, hand_joints]
  sdk_position_limits: [[0.12, 1.28], [0.17, 1.78], [0.17, 1.78], [0.17, 1.78], [0.17, 1.78], [0.0, 1.68]]
  max_tracking_error: 1
  joints:
  - &thumb_bend
    name: thumb_bend
    index: 0
    sign: 1
    zero: 0.0
    kind: finger
    verified: true
    limits: &thumb_bend_limits
      min_position: 0.12
      max_position: 1.28
      max_velocity: 0.8
      max_feedback_velocity: 3.14
      max_position_step: 0.02
      max_tracking_error: 1
  - &finger
    <<: *thumb_bend
    name: index_flexion
    index: 1
    limits: &finger_limits
      min_position: 0.17
      max_position: 1.78
      max_velocity: 0.8
      max_feedback_velocity: 3.14
      max_position_step: 0.02
      max_tracking_error: 1
  - {<<: *finger, name: middle_flexion, index: 2}
  - {<<: *finger, name: ring_flexion, index: 3}
  - {<<: *finger, name: pinky_flexion, index: 4}
  - &thumb_swing
    <<: *thumb_bend
    name: thumb_swing
    index: 5
    limits: &thumb_swing_limits
      min_position: 0.0
      max_position: 1.68
      max_velocity: 0.8
      max_feedback_velocity: 3.14
      max_position_step: 0.02
      max_tracking_error: 1
- <<: *aurora_hand
  name: right_hand
  side: right
  # 2026-10-28: operator observed thumb->index->middle->ring->pinky->thumb
  # with the old slots; isolated thumb flexion predominantly changed Bend6 raw[8].
  # Right SDK order: index, middle, ring, pinky, thumb bend, thumb swing.
  # Move each joint's existing SDK bounds with its index; do not widen any limits.
  sdk_position_limits: [[0.17, 1.78], [0.17, 1.78], [0.17, 1.78], [0.17, 1.78], [0.12, 1.28], [0.0, 1.68]]
  joints:
  # Match the operator's previous bridge: 0.03 rad per 100 Hz period = 3 rad/s.
  # This is a command slew setting, not a verified motor maximum speed.
  # Retain the existing 3.14 rad/s feedback threshold and all position bounds.
  - <<: *thumb_bend
    index: 4
    limits: {<<: *thumb_bend_limits, max_velocity: 3.0, max_position_step: 0.03}
  - &right_finger
    <<: *finger
    index: 0
    limits: {<<: *finger_limits, max_velocity: 3.0, max_position_step: 0.03}
  - {<<: *right_finger, name: middle_flexion, index: 1}
  - {<<: *right_finger, name: ring_flexion, index: 2}
  - {<<: *right_finger, name: pinky_flexion, index: 3}
  - <<: *thumb_swing
    limits: {<<: *thumb_swing_limits, max_velocity: 3.0, max_position_step: 0.03}
allow_missing_velocity_cmd: true
minimum_stable_level: 100
stable_wait_seconds: 3.0
