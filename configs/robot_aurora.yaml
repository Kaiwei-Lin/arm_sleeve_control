# GR3 layout/SDK limits from electronic_skin_project reference demo and Fourier.
# Physical order: shoulder_pitch, shoulder_roll, shoulder_yaw, elbow_pitch,
#                 wrist_yaw, wrist_pitch, wrist_roll.
# verified=false: semantic signs/zero and conservative software motion limits
# MUST still be checked on this installation. Especially upper-arm rotation sign.
# This template does not authorize motion; fill verification/authority fields
# and group/joint verified flags only after deployment validation.
api_family: aurora-python-dds-0.1.8
sdk_version: 0.1.8
verified: false
simulated: false
verification_note: ''
robot_type: GR3
authority_verified: false
