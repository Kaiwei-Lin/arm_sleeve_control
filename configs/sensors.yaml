# Serial values come from the previously validated arm_data_collector implementation.
# Port names remain unset because they are machine-specific.
sensors:
  # Optional single Bend5 glove; enable here or pass --glove real/fake.
  glove:
    enabled: false
    backend: bend5
    port: null  # e.g. /dev/ttyUSB0 or COM5; must differ from Sleeve/IMU ports.
    baudrate: 115200
    timeout_s: 0.02
    # Optional local Bend5 calibration JSON, relative to this YAML's directory.
    calibration_path: null
    stale_timeout_s: 0.25
    startup_timeout_s: 10.0
    source_options:
      expected_fields: 11
      zero_on_start: true  # keep all five fingers straight during startup
      zero_frames: 30
      per_finger_max_delta: null  # use calibration JSON; otherwise 1000.0 (tune per glove)
      filter_alpha: 0.75
  sleeve:
    enabled: true
    backend: serial_ascii
    port: /dev/ttyUSB2
    baudrate: 115200
    timeout_s: 1.0
    delimiter: ";"
    expected_fields: 11
  #胸
  imu1:
    enabled: true
    backend: imu770_serial
    port: /dev/ttyCH9344USB3
    baudrate: 460800
    timeout_s: 0.1
  #小臂
  imu2:
    enabled: true
    backend: imu770_serial
    port: /dev/ttyCH9344USB2
    baudrate: 460800
    timeout_s: 0.1

  # Configure these two machine-specific ports before real rotation control.
  #前大臂
  imu3:
    enabled: true
    backend: imu770_serial
    port: /dev/ttyCH9344USB5
    baudrate: 460800
    timeout_s: 0.1
  #后大臂
  imu4:
    enabled: true
    backend: imu770_serial
    port: /dev/ttyCH9344USB4
    baudrate: 460800
    timeout_s: 0.1

# DualImuArmEstimator inputs. IMU1 is on the right upper arm; IMU2 is on the chest.
shoulder_imu:
  arm_imu: imu4
  chest_imu: imu1
  max_sync_ms: null
  calibration_seconds: 2.0
  startup_timeout_s: 10.0

# Optional dual-IMU upper-arm rotation. Enable only after both IMU endpoints
# and the calibrated ID24 robot limits are ready.
upper_arm_rotation:
  enabled: true
  upper_imu: imu3
  reference_imu: imu2
  # Parser order is [w,x,y,z]; interpreted as Sensor->World per the reference demo.
  twist_axis: x
  ema_alpha: 0.35
  # null: fall back to synchronization.max_time_delta_ms.
  max_sync_ms: null
  calibration_seconds: 2.0
  startup_timeout_s: 10.0

# Software defaults for initial synchronization tests, not validated experiment parameters.
synchronization:
  max_time_delta_ms: 20
  buffer_duration_ms: 500

recording:
  output_dir: recordings
  format: csv
