phase3:
  elbow:
    # Human-facing channel numbers are 1-based: CH2 == SleeveFrame.channels[1].
    sleeve_channel: 1

    # Must be filled from tools/calibrate_sleeve_elbow.py before real Sleeve use.
    input_min: null
    input_max: null
    invert_input: false
    deadzone: 0.02

    filter:
      type: ema
      alpha: 0.2

    # Absolute human elbow angles corresponding to input_min/input_max.
    # Fill from the two calibration postures; these are not robot limits.
    angle_range:
      min_deg: null
      max_deg: null

    invert_output: false

  sensor_timeout_ms: 200
  hard_timeout_ms: 1000
  control_hz: 100
