predictor:
  backend: flex_model
  model_module: flex_model_0003
  model_class: FlexPredictor

  # Human-facing 1-based channels: CH2/3/4 -> channels[1]/[2]/[3].
  sleeve_channels: [2, 3, 4]

  # Generated by tools/calibrate_flex_model.py after the garment is put on.
  calibration_file: calibrations/flex_calibration.json

  # Reserved for experiment telemetry; Phase 4 does not filter by confidence.
  min_action_confidence: 0.60

  action_stability:
    required_consecutive_frames: 3

  angle:
    min_deg: 0.0
    # Required: fill from the actual model training-label range.
    max_deg: null

phase4_validation:
  # Shoulder regression is an absolute human semantic angle. Real execution
  # therefore requires calibrated shoulder zero/min/max in configs/robot.yaml.
  max_consecutive_prediction_errors: 3
